<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earnova</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    .logo {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 35px;
    }

    .card {
      background: white;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .price {
      font-size: 32px;
      font-weight: 800;
      margin: 15px 0 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
    }

    .note {
      margin-top: 25px;
      font-size: 13px;
      color: #6b7280;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Earnova</div>

    <div class="subtitle">
      Join Earnova and access our platform and member services.
    </div>

    <div class="card">

      <h2>Membership Access</h2>

      <div class="price">₦5,000</div>

      <input
        type="email"
        id="email"
        placeholder="Enter your email address"
        required
      >

      <button id="payButton">
        Join Earnova — ₦5,000
      </button>

      <div id="message"></div>

      <div class="note">
        Your payment will be processed securely through Paystack.
        Membership access is provided according to Earnova's stated terms.
      </div>

    </div>

  </div>

  <script>
    const SUPABASE_FUNCTION_URL =
      "https://rrrbqmnmtwmhukistuzv.supabase.co/functions/v1/initialize-payment";

    const emailInput = document.getElementById("email");
    const payButton = document.getElementById("payButton");
    const message = document.getElementById("message");

    payButton.addEventListener("click", async () => {

      const email = emailInput.value.trim();

      if (!email || !email.includes("@")) {
        message.textContent = "Please enter a valid email address.";
        return;
      }

      payButton.disabled = true;
      payButton.textContent = "Connecting to Paystack...";
      message.textContent = "";

      try {

        const response = await fetch(SUPABASE_FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.error || "Unable to initialize payment."
          );
        }

        window.location.href = data.authorization_url;

      } catch (error) {

        message.textContent =
          error.message || "Something went wrong. Please try again.";

        payButton.disabled = false;
        payButton.textContent = "Join Earnova — ₦5,000";
      }
    });
  </script>

</body>
  </html>
